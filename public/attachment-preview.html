<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>e-Gov PDF｜星野式法令三段表製作所</title>
<style>html,body{height:100%;margin:0;background:#ebebeb;font-family:sans-serif}#status{padding:24px;line-height:1.8}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<div id="status" role="status">e-GovのPDFを読み込み中…</div>
<script type="module">
const status=document.getElementById('status');
let objectURL;
try {
 const params=new URLSearchParams(location.search),revision=params.get('revision'),src=params.get('src');
 if(!revision||!src||! /\.pdf$/i.test(src))throw Error('PDFの参照先が指定されていません。');
 const url=`https://laws.e-gov.go.jp/api/2/attachment/${encodeURIComponent(revision)}?src=${encodeURIComponent(src)}`;
 const response=await fetch(url);
 if(!response.ok)throw Error(`PDFを取得できませんでした（${response.status}）。`);
 const bytes=await response.arrayBuffer();
 const signature=new TextDecoder().decode(bytes.slice(0,1024));
 if(!signature.includes('%PDF-'))throw Error('取得したファイルがPDFではありません。');
 // A local PDF blob avoids the API's attachment Content-Disposition header.
 objectURL=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
 const frame=document.createElement('iframe');frame.title='e-GovのPDF';frame.src=objectURL;
 document.body.replaceChildren(frame);
 document.title=`${src.split('/').pop()}｜e-Gov PDF`;
} catch(error) {
 status.textContent=`${error.message} 元の画面からもう一度開いてください。`;
 status.setAttribute('role','alert');
}
addEventListener('pagehide',()=>{if(objectURL)URL.revokeObjectURL(objectURL);});
</script>
</body>
</html>
